# REFERENCE ONLY. Key Zigbee2MQTT settings used on this Pi.
# The real file is /opt/zigbee2mqtt/data/configuration.yaml on the Pi.
# Do NOT copy this over the real file, and never commit the real file:
# it contains the Zigbee network key (advanced.network_key).

mqtt:
  base_topic: zigbee2mqtt
  server: mqtt://localhost:1883

serial:
  # Use the stable by-id path from: ls -l /dev/serial/by-id/
  port: /dev/serial/by-id/usb-ITead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_<serial>-if00-port0
  adapter: zstack            # Sonoff dongle with the CC2652P chip

frontend:
  enabled: true              # was false after onboarding; must be true for :8080
  port: 8080

advanced:
  network_key: GENERATE       # generated by Zigbee2MQTT on first start. SECRET.
                              # Never reuse the key from the old public repo.

# Devices and groups are stored in the same file by Zigbee2MQTT. See docs/devices.md
# for the human-readable list (names, groups, bindings).
